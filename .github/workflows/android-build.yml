name: Manual Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Android folder via Expo
        run: npx expo prebuild --platform android --clean

      - name: Copy our custom service files
        run: |
          mkdir -p android/app/src/main/java/com/tiktokautoscroll/app
          cp -r android/app/src/main/java/com/tiktokautoscroll/app/* android/app/src/main/java/com/tiktokautoscroll/app/ 2>/dev/null || true
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Build APK via Gradle directly
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
